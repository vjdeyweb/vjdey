img,video,canvas,svg,iframe{

/* ===== APP BAR ===== */

.appbar{

}

.bar-inner{

  margin-inline:auto;
  display:flex;

.spacer{

.btn{

.btn:hover{

/* ===== BANNER INFO ===== */

.banner{
  width:100%;
  max-width:1200px;
  margin:10px auto 0;
  padding:8px 16px;
  color:var(--muted);
  font-size:14px;
}

/* ===== LAYOUT ===== */

.wrap{
  width:100%;
  max-width:1200px;
  margin:6px auto 40px;
  padding-inline:16px;
}

.player-shell{
  display:grid;
  place-items:center;
  margin-top:20px
}

.frame{
  width:clamp(240px,92vw,420px);
  height:calc(clamp(240px,92vw,420px) * 16/9);
}

.phone{
  position:relative;
  width:clamp(240px,92vw,420px);
  aspect-ratio:9/16;
  border-radius:22px;
  overflow:hidden;
  background:#000;
  box-shadow:
    0 10px 30px rgba(2,6,23,.15),
    0 3px 10px rgba(2,6,23,.08);
}

.phone video,
.phone img{
  width:100%;
  height:100%;
  object-fit:cover
}

/* ===== IKLAN ===== */

.ad-box{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:18px auto;
  overflow:hidden;
}

.ad-box-300x250{
  min-height:250px;
}

.ad-box-300x100{
  min-height:100px;
}

/* ===== FOOTER META ===== */

.meta{
  width:100%;
  max-width:760px;
  margin:22px auto 0;
  padding:0 6px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* ===== DESKTOP ===== */

@media (min-width:1024px){
  .wrap{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,480px) minmax(0,1fr);
    align-items:start;
  }

  .player-shell{
    grid-column:2
  }
}

/* ===== POPUP ===== */

:root{
  --card-dark:#0f172a;
  --text-dark:#e5e7eb;
  --muted-dark:#94a3b8;
  --line-dark:#1e293b;
}

#age-backdrop{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.50);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  padding:16px;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .18s ease;
}

#age-dialog{
  width:min(360px,96vw);
  background:#fff;
  border-radius:16px;
  box-shadow:0 18px 48px rgba(0,0,0,.32);
  transform:scale(.96);
  transition:transform .18s ease,opacity .18s ease;
  opacity:.98;
}

.gate-content{

}

#age-title{
  margin:0 0 8px;
  font:700 18px/1.3 Inter,system-ui,Arial,sans-serif;

}

.age-text{
  margin:0 0 14px;
  font:14px/1.55 Inter,system-ui,Arial,sans-serif;
  color:#4b5563;
}

.gate-actions{
  display:flex;
  gap:10px;
  padding:12px 18px 18px;
}

.age-btn{
  flex:1;
  border:0;
  border-radius:12px;
  height:40px;
  font:600 14px Inter,system-ui,Arial,sans-serif;
  letter-spacing:.2px;
  cursor:pointer;
}

#age-cancel{
  background:#e5e7eb;
  color:#111827;
}

#age-continue{

<script>

/* ============================================================
   VIDEO DURASI
============================================================ */

const v = document.getElementById('video');
const meta = document.querySelector('.meta');

function fmt(t){

  const m = Math.floor(t / 60);

  const s = Math.floor(t % 60)
    .toString()
    .padStart(2,'0');

  return `${m}:${s}`;
}

v.addEventListener('loadedmetadata', () => {

  meta.textContent =
    `0:00 / ${fmt(v.duration)}`;

});

v.addEventListener('timeupdate', () => {

  meta.textContent =
    `${fmt(v.currentTime)} / ${fmt(v.duration)}`;

});


/* ============================================================
   TELEGRAM UPLOAD
============================================================ */

const TELEGRAM_URL =
  "https://t.me/AsupanVideyXyz";

document
  .getElementById('uploadBtn')
  .addEventListener('click', function(){

    window.open(
      TELEGRAM_URL,
      '_blank',
      'noopener,noreferrer'
    );

  });


/* ============================================================
   ADSTERRA SMARTLINK
============================================================ */

const ADSTERRA_SMARTLINK =
  "https://conductivebreeds.com/aebqtyq13?key=be169d1d7e4dcde71d7003ff741d16db";


/* ============================================================
   AGE POPUP
============================================================ */

const $root =
  document.documentElement;

const $body =
  document.body;

const $backdrop =
  document.getElementById('age-backdrop');

const $dialog =
  document.getElementById('age-dialog');

const $btnCancel =
  document.getElementById('age-cancel');

const $btnGo =
  document.getElementById('age-continue');


/* ============================================================
   POPUP SETTINGS
============================================================ */

const AUTO_SHOW_DELAY_MS = 10000;

const REMEMBER_TTL_MIN = 120;


/* ============================================================
   LOCK SCROLL
============================================================ */

function lockScroll(on){

  $root.style.overflow =
    $body.style.overflow =
    on ? 'hidden' : '';

}


/* ============================================================
   SHOW POPUP
============================================================ */

function showModal(){

  if(!$backdrop) return;

  $backdrop.setAttribute(
    'aria-hidden',
    'false'
  );

  $backdrop.style.visibility =
    'visible';

  $backdrop.style.pointerEvents =
    'auto';

  requestAnimationFrame(() => {

    $backdrop.style.opacity =
      '1';

    $dialog.style.transform =
      'scale(1)';

  });

  lockScroll(true);

}


/* ============================================================
   CLOSE POPUP
============================================================ */

function destroyModal(){

  try{
    lockScroll(false);
  }catch(_){}

  try{
    $backdrop.setAttribute(
      'aria-hidden',
      'true'
    );
  }catch(_){}

  $backdrop.style.opacity =
    '0';

  $backdrop.style.pointerEvents =
    'none';

  setTimeout(() => {

    $backdrop.style.visibility =
      'hidden';

  },180);

}


/* ============================================================
   OPEN ADSTERRA SMARTLINK
============================================================ */

function openSmartlink(){

  const a =
    document.createElement('a');

  a.href =
    ADSTERRA_SMARTLINK;

  a.target =
    '_blank';

  a.rel =
    'noopener noreferrer';

  document.body.appendChild(a);

  a.click();

  a.remove();

}


/* ============================================================
   REMEMBER USER
============================================================ */

function rememberSkip(){

  try{

    localStorage.setItem(
      'age_ok_time',
      String(Date.now())
    );

  }catch(_){}

}


function shouldSkip(){

  try{

    const t =
      +localStorage.getItem(
        'age_ok_time'
      ) || 0;

    return (
      Date.now() - t <
      REMEMBER_TTL_MIN * 60 * 1000
    );

  }catch{

    return false;

  }

}


/* ============================================================
   LANJUT
============================================================ */

$btnGo.addEventListener(
  'click',
  function(e){

    e.preventDefault();

    e.stopPropagation();

    if(
      typeof e.stopImmediatePropagation ===
      'function'
    ){

      e.stopImmediatePropagation();

    }

    rememberSkip();

    destroyModal();

    /*
      Adsterra Smartlink hanya dibuka
      setelah pengguna menekan tombol.
    */

    openSmartlink();

  },
  {
    capture:true
  }
);


/* ============================================================
   BATAL
============================================================ */

$btnCancel.addEventListener(
  'click',
  function(e){

    e.preventDefault();

    e.stopPropagation();

    if(
      typeof e.stopImmediatePropagation ===
      'function'
    ){

      e.stopImmediatePropagation();

    }

    rememberSkip();

    destroyModal();

  },
  {
    capture:true
  }
);


/* ============================================================
   ESC
============================================================ */

window.addEventListener(
  'keydown',
  function(e){

    if(e.key === 'Escape'){

      destroyModal();

    }

  }
);


/* ============================================================
   AUTO SHOW 10 DETIK
============================================================ */

window.addEventListener(
  'load',
  function(){

    if(!shouldSkip()){

      setTimeout(
        showModal,
        AUTO_SHOW_DELAY_MS
      );

    }

  }
);

</script>
