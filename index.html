*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#090909;
  color:#fff;
  min-height:100vh
}

a{
  text-decoration:none;
  color:inherit
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(9,9,9,.96);
  border-bottom:1px solid #252525;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:14px
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-.5px
}

.logo span{
  color:#e50914
}

.search{
  margin-left:auto;
  width:min(360px,55vw);
  background:#171717;
  border:1px solid #303030;
  color:#fff;
  border-radius:9px;
  padding:10px 13px;
  outline:none
}

.search::placeholder{
  color:#777
}

.hero{
  padding:28px 18px 10px;
  max-width:1200px;
  margin:auto
}

.hero h1{
  font-size:28px;
  margin-bottom:8px
}

.hero p{
  color:#aaa;
  font-size:14px
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:18px
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px
}

.card{
  background:#151515;
  border:1px solid #242424;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s
}

.card:hover{
  transform:translateY(-3px);
  border-color:#444
}

.thumb{
  position:relative;
  aspect-ratio:16/9;
  background:#111;
  overflow:hidden
}

.thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.play{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.45)
  )
}

.play i{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#e50914;
  display:grid;
  place-items:center;
  font-style:normal;
  font-size:20px;
  padding-left:3px;
  box-shadow:0 5px 20px #000
}

.info{
  padding:11px 12px
}

.title{
  font-size:15px;
  font-weight:700;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.meta{
  color:#888;
  font-size:12px;
  margin-top:7px
}

.empty{
  display:none;
  text-align:center;
  color:#888;
  padding:50px 10px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.92);
  padding:20px;
  align-items:center;
  justify-content:center
}

.modal.show{
  display:flex
}

.player{
  width:min(1000px,100%);
  background:#111;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #292929
}

.player video{
  display:block;
  width:100%;
  max-height:75vh;
  background:#000
}

.close{
  position:absolute;
  right:18px;
  top:14px;
  border:0;
  background:#fff;
  color:#111;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:24px;
  cursor:pointer
}

.player-info{
  padding:14px 16px
}

.player-info h2{
  font-size:18px
}

footer{
  text-align:center;
  color:#666;
  font-size:12px;
  padding:35px 15px
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr)
  }
}

@media(max-width:650px){

  .header{
    padding:12px
  }

  .logo{
    font-size:20px
  }

  .search{
    width:48%;
    font-size:12px
  }

  .hero{
    padding:22px 12px 8px
  }

  .hero h1{
    font-size:23px
  }

  .wrap{
    padding:12px
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px
  }

  .info{
    padding:9px
  }

  .title{
    font-size:13px
  }

  .meta{
    font-size:11px
  }

  .modal{
    padding:10px
  }

  .close{
    right:10px;
    top:8px
  }
}

          muted
          playsinline
          preload="metadata"
        ></video>

        <div class="play">
          <i>▶</i>
        </div>

      </div>

      <div class="info">

        <div class="title">
          ${item.title}
        </div>

        <div class="meta">
          HD • Video
          ${String(index+1).padStart(3,"0")}
        </div>

      </div>

    `;


    card.addEventListener("click",()=>{

      /*
       * Smartlink dibuka saat kartu diklik.
       * Player tetap dibuka setelahnya.
       */

      window.open(
        SMARTLINK,
        "_blank",
        "noopener,noreferrer"
      );

      openVideo(item);

    });


    grid.appendChild(card);

  });

}


/* =====================================================
   OPEN VIDEO
   ===================================================== */

function openVideo(item){

  mainTitle.textContent =
    item.title;

  mainVideo.src =
    item.url;

  modal.classList.add("show");

  mainVideo.play().catch(()=>{});

}


/* =====================================================
   CLOSE VIDEO
   ===================================================== */

function closeVideo(){

  mainVideo.pause();

  mainVideo.removeAttribute("src");

  mainVideo.load();

  modal.classList.remove("show");

}


/* =====================================================
   CLOSE BUTTON
   ===================================================== */

document
.getElementById("close")
.addEventListener(
  "click",
  closeVideo
);


/* =====================================================
   KLIK LUAR PLAYER
   ===================================================== */

modal.addEventListener(
  "click",
  function(e){

    if(e.target === modal){

      closeVideo();

    }

  }
);


/* =====================================================
   ESC
   ===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      closeVideo();

    }

  }
);


/* =====================================================
   SEARCH
   ===================================================== */

search.addEventListener(
  "input",
  function(){

    const q =
      search.value
      .toLowerCase()
      .trim();

    const filtered =
      videos.filter(video=>

        video.title
        .toLowerCase()
        .includes(q)

      );

    render(filtered);

  }
);


/* =====================================================
   TAMPILKAN SEMUA VIDEO
   ===================================================== */

render(videos);

</script>

</body>
</html>
