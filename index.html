<!doctype html>
<html lang="id">
<head>

<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>PRANKOJOL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet">


<!-- =====================================================

<script
  src="https://richinfo.co/richpartners/pops/js/richads-pu-ob.js"

  async
  data-cfasync="false">
</script>


<style>

:root{
  --bg:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --dark:#111827;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

html,
body{
  min-height:100%;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Ubuntu,
    sans-serif;

  background:var(--bg);
  color:var(--text);

  overflow-x:hidden;
}


/* =====================================================
   HEADER
   ===================================================== */

.appbar{
  position:sticky;
  top:0;
  z-index:20;

  background:#fff;
  border-bottom:1px solid var(--line);
}

.bar-inner{
  max-width:1200px;
  margin:auto;

  display:flex;
  align-items:center;

  padding:10px 16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;

  font-weight:700;
}

.logo{
  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  background:var(--dark);
  color:#fff;

  border-radius:6px;
}

.spacer{
  flex:1;
}

.btn{
  border:0;

  padding:10px 14px;

  border-radius:12px;

  background:var(--dark);
  color:#fff;

  font-weight:600;

  cursor:pointer;
}


/* =====================================================
   BANNER
   ===================================================== */

.banner{
  max-width:1200px;
  margin:10px auto;

  padding:8px 16px;

  color:var(--muted);

  font-size:13px;
}


/* =====================================================
   CONTENT
   ===================================================== */

.wrap{
  max-width:1200px;
  margin:auto;

  padding:16px;
}

.player-shell{
  display:grid;
  place-items:center;
}


/* =====================================================
   VIDEO
   ===================================================== */

.phone{
  width:clamp(240px,92vw,420px);

  aspect-ratio:9/16;

  border-radius:22px;

  overflow:hidden;

  background:#000;

  position:relative;
}

.phone video{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:#000;
}


/* =====================================================
   META
   ===================================================== */

.meta{
  margin-top:20px;

  text-align:center;

  color:var(--muted);

  font-size:13px;
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="appbar">

  <div class="bar-inner">

    <div class="brand">

      <span class="logo">V</span>

      <span>
        vldey<span style="color:#3b82f6">.co</span>
      </span>

    </div>

    <div class="spacer"></div>

    <button
      class="btn"
      type="button">
      Upload
    </button>

  </div>

</header>


<!-- =====================================================
     ADVERTISE
     ===================================================== -->

<div class="banner">
  Advertise
</div>


<!-- =====================================================
     VIDEO
     ===================================================== -->

<main class="wrap">

  <section class="player-shell">

    <div
      class="phone"
      id="videoBox">

      <video
        id="video"
        playsinline
        controls
        preload="metadata">

        <!-- GANTI VIDEO DENGAN URL MP4 KAMU -->

        <source
          src="https://cdn2.videy.co/krhD8gAr1.mp4"
          type="video/mp4">

        Browser kamu tidak mendukung video HTML5.

      </video>

    </div>


    <div
      class="meta"
      id="meta">

      0:00 / 3:57 • Putar untuk memulai

    </div>

  </section>

</main>


<script>

/* =====================================================
   VIDEO PLAYER
   ===================================================== */

const video =
  document.getElementById("video");

const meta =
  document.getElementById("meta");


function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");

  return `${minutes}:${secs}`;
}


video.addEventListener(
  "loadedmetadata",
  function(){

    meta.textContent =
      `0:00 / ${formatTime(video.duration)}`;

  }
);


video.addEventListener(
  "timeupdate",
  function(){

    meta.textContent =
      `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;

  }
);


/* =====================================================
   KADAM DIRECT LINK
   ===================================================== */

const KADAM_DIRECTLINK =
  "https://viiukuhe.com/dc/?blockID=427920";


/*
   DirectLink hanya dipicu oleh aksi pengguna.

   Tidak ada:
   - auto redirect
   - redirect 15 detik
   - GeoJS
   - redirect ketika halaman dibuka
*/

let kadamOpened = false;


document
  .getElementById("videoBox")
  .addEventListener(
    "click",
    function(){

      /*
       * Hanya satu kali per halaman.
       * Ini mencegah DirectLink dibuka terus-menerus
       * setiap kali pengguna menyentuh video.
       */

      if(kadamOpened){
        return;
      }

      kadamOpened = true;


      /*
       * Buka DirectLink sebagai hasil langsung
       * dari tindakan pengguna.
       *
       * RichAds tetap memiliki kesempatan
       * memproses klik yang sama melalui
       * script Popunder-nya.
       */

      const newTab =
        window.open(
          KADAM_DIRECTLINK,
          "_blank",
          "noopener,noreferrer"
        );


      /*
       * Jika browser memblokir tab baru,
       * jangan melakukan redirect paksa.
       *
       * Video tetap bisa digunakan.
       */

      if(!newTab){

        kadamOpened = false;

      }

    },
    true
  );

</script>


</body>
</html>
